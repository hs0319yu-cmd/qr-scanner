<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>QRライブスキャン</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:18px}h1{font-size:24px;margin:12px 0}p{font-size:16px;line-height:1.5;color:#d1d5db}#reader{width:min(92vw,520px);margin:18px auto;background:#000;border-radius:16px;overflow:hidden}button{font-size:18px;font-weight:700;padding:14px 20px;border:0;border-radius:12px;background:#2563eb;color:#fff;margin:8px}#status{min-height:48px;padding:8px;color:#fde68a}#cancel{background:#4b5563}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<h1>📷 QRライブスキャン</h1>
<p>QRコードを枠内に映してください。読み取ると在庫アプリに戻ります。</p>
<div id="status">カメラを準備しています…</div>
<div id="reader"></div>
<button id="restart" type="button">カメラを再起動</button>
<button id="cancel" type="button">戻る</button>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  let scanner = null;
  let busy = false;
  const status = document.getElementById('status');
  const reader = document.getElementById('reader');

  function sendResult(value) {
    if (!window.opener || window.opener.closed) {
      status.textContent = '元の在庫アプリが見つかりません。元の画面からQR読み込みを押してください。';
      return;
    }
    window.opener.postMessage({ type: 'INVENTORY_QR_RESULT', token, value: String(value) }, '*');
    status.textContent = '読み取り成功！在庫アプリに戻ります…';
    stopScanner().finally(() => setTimeout(() => window.close(), 250));
  }

  async function stopScanner() {
    if (!scanner) return;
    const current = scanner;
    scanner = null;
    try { await current.stop(); } catch (e) {}
    try { await current.clear(); } catch (e) {}
  }

  async function startScanner() {
    if (busy) return;
    busy = true;
    status.textContent = 'カメラを起動しています…';
    await stopScanner();
    reader.innerHTML = '';
    try {
      if (!window.Html5Qrcode) throw new Error('QR読み取りライブラリを読み込めませんでした。通信を確認してください。');
      scanner = new Html5Qrcode('reader');
      const config = { fps: 10, qrbox: (w,h) => { const s = Math.floor(Math.min(w,h,320)); return {width:s,height:s}; }, aspectRatio: 1.0 };
      const cameras = await Html5Qrcode.getCameras();
      if (!cameras || !cameras.length) throw new Error('利用できるカメラが見つかりません。');
      const back = cameras.find(c => /back|rear|environment|背面|後ろ/i.test(c.label));
      await scanner.start(back ? back.id : { facingMode: 'environment' }, config, sendResult, () => {});
      status.textContent = 'QRコードを枠内に映してください。';
    } catch (e) {
      console.error(e);
      await stopScanner();
      status.textContent = 'カメラを起動できません: ' + (e && e.message ? e.message : String(e)) + '。Safariで開き、カメラ許可とHTTPS接続を確認してください。';
    } finally { busy = false; }
  }

  document.getElementById('restart').addEventListener('click', startScanner);
  document.getElementById('cancel').addEventListener('click', async () => { await stopScanner(); window.close(); });
  window.addEventListener('pagehide', () => { if (scanner) { try { scanner.stop(); } catch(e) {} } });
  if (!token) status.textContent = '起動情報がありません。元の在庫アプリからQR読み込みを押してください。';
  else startScanner();
})();
</script>
</body>
</html>
